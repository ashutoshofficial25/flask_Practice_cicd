name: CI-CD-Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::616532575158:role/AWS-Github-Push-Role
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 |
            docker login --username AWS \
            --password-stdin 616532575158.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t py-app .

      - name: Tag and push Docker image
        run: |
          docker tag py-app:latest \
          616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest

          docker push \
          616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest
      - name: Write SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_SECRET_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Log in to ECR on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 616532575158.dkr.ecr.ap-south-1.amazonaws.com
          EOF

      - name: Pull and redeploy on EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
          docker pull 616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest
          docker stop py-app || true
          docker rm py-app || true
          docker run -d -p 5000:5000 --name py-app -e MONGO_URI="${{ secrets.MONGO_URI }}" 616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest
          EOF

      - name: Health check
        run: |
          sleep 10 # Wait for the container to start
          curl -f http://${{secrets.SERVER_HOST}}:5000/health || exit 1

      - name: Email on success
        if: success()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'CI/CD SUCCESS: ${{ github.repository }} (${{ github.workflow }} #${{ github.run_number }})'
          to: ${{ secrets.MAIL_TO }}
          from: CI/CD Pipeline <${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}>
          body: |
            Pipeline succeeded on ${{ github.repository }}.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

      - name: Email on failure
        if: failure()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: ${{ secrets.SMTP_SERVER }}
          server_port: ${{ secrets.SMTP_PORT }}
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          subject: 'CI/CD FAILED: ${{ github.repository }} (${{ github.workflow }} #${{ github.run_number }})'
          to: ${{ secrets.MAIL_TO }}
          from: CI/CD Pipeline <${{ secrets.MAIL_FROM || secrets.SMTP_USERNAME }}>
          body: |
            Pipeline failed on ${{ github.repository }}.

            Branch: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Triggered by: ${{ github.actor }}
            Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
