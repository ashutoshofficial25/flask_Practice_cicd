name: CI-CD-Pipeline

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MONGO_URI: ${{ secrets.MONGO_URI }}
        run: |
          pytest

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::616532575158:role/AWS-Github-Push-Role
          aws-region: ap-south-1

      - name: Log in to Amazon ECR
        run: |
          aws ecr get-login-password --region ap-south-1 |
            docker login --username AWS \
            --password-stdin 616532575158.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build Docker image
        run: |
          docker build -t py-app .

      - name: Tag and push Docker image
        run: |
          docker tag py-app:latest \
          616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest

          docker push \
          616532575158.dkr.ecr.ap-south-1.amazonaws.com/py-app:latest

      - name: Health check
        run: |
          sleep 10 # Wait for the container to start
          curl -f http://13.201.72.173:5000/health || exit 1
